<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d97706" />
  <title>Sem ligação — MozLit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #fffbeb 0%, #fef3c7 55%, #fde68a 100%);
      color: #451a03;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #1c1917 0%, #292524 60%, #1c1917 100%); color: #fef3c7; }
      .cartao { background: rgba(41, 37, 36, 0.7); border-color: rgba(251, 191, 36, 0.25); }
      .botao { background: #d97706; color: #fff; }
      .botao:hover { background: #b45309; }
    }
    .cartao {
      max-width: 380px;
      padding: 40px 32px;
      border-radius: 20px;
      border: 1px solid rgba(217, 119, 6, 0.25);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 20px 50px rgba(120, 53, 15, 0.12);
    }
    .icone { width: 64px; height: 64px; margin: 0 auto 20px; }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.9rem; opacity: 0.75; line-height: 1.6; margin-bottom: 24px; }
    .botao {
      display: inline-block;
      border: none;
      border-radius: 999px;
      padding: 11px 32px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .marca { margin-top: 22px; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.5; }
  </style>
</head>
<body>
  <main class="cartao">
    <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    <h1>Está sem ligação à internet</h1>
    <p>Não faz mal — os seus livros esperam por si. Verifique a sua conexão e volte a tentar.</p>
    <button class="botao" onclick="window.location.reload()">Tentar novamente</button>
    <div class="marca">MozLit</div>
  </main>
</body>
</html>
